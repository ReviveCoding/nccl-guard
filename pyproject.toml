[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nccl-guard"
version = "0.1.0"
description = "Topology-aware distributed-training characterization, tuning, and reliability framework"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "PyYAML>=6", "psutil>=7", "torch>=2.13", "pandas>=3", "pyarrow>=20"]

[project.optional-dependencies]
dev = ["build", "mypy", "pytest", "ruff"]
tuning = ["optuna>=4"]
data = ["datasets>=4", "transformers>=5"]

[project.scripts]
nccl-guard = "nccl_guard.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["nccl_guard"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
