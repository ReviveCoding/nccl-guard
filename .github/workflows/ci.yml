name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify CPU-only Torch
        run: python -c "import torch; assert torch.version.cuda is None, torch.__version__; print(torch.__version__)"
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Lint
        run: python -m ruff check src tests scripts external
      - name: Type check
        run: python -m mypy --python-version ${{ matrix.python-version }} src
      - name: Test
        run: python -m pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test wheel without runtime dependencies
        run: |
          python -m venv /tmp/nccl-guard-wheel
          /tmp/nccl-guard-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/nccl-guard-wheel/bin/nccl-guard --help
          /tmp/nccl-guard-wheel/bin/python -c "import nccl_guard; print(nccl_guard.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-shell-contract:
    name: Linux shell contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse Bash scripts
        run: bash -n scripts/linux/*.sh
      - name: Verify fail-closed Linux invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SKIP_UNSUPPORTED: WSL is not an authoritative NCCL-Guard qualification host.' scripts/linux/preflight.sh
          grep -Fq 'NON_AUTHORITATIVE_PREFLIGHT' scripts/linux/preflight.sh
          grep -Fq 'NCCL_GUARD_LINUX_VENV=".venv-linux-core"' scripts/linux/preflight.sh
          grep -Fq 'NCCL_GUARD_PINNED_NCCL_TESTS_REVISION="b4d5beebca8a76cf01335f724d154b9b9d394d96"' scripts/linux/preflight.sh
          grep -Fq 'sys.version_info < (3, 11)' scripts/linux/preflight.sh
          grep -Fq 'candidates=(python3.12 python3.11 python3 python)' scripts/linux/preflight.sh

  windows-powershell-contract:
    name: Windows PowerShell contract
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -LiteralPath scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List
            throw "PowerShell parsing failed with $($allErrors.Count) error(s)."
          }
