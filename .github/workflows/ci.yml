name: source-quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
      - run: python -m build
      - run: python -m venv /tmp/nccl-guard-wheel
      - run: /tmp/nccl-guard-wheel/bin/pip install dist/*.whl
      - run: /tmp/nccl-guard-wheel/bin/nccl-guard --help
      - run: echo 'Hosted CI does not reproduce GPU or NCCL experiments.'
